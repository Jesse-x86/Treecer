[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "treecer"
version = "0.1.1"
description = "Local discussion trees for AI-assisted conversations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["discussion-tree", "ai-assistant", "mcp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = ["mcp>=1.29,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "PyYAML", "twine>=6.1"]

[project.scripts]
treecer = "treecer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
treecer = ["assets/skills/treecer/SKILL.md", "assets/manual/zh/*.md", "assets/manual/en/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
