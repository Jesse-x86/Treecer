[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treecer"
version = "0.1.1"
description = "Local discussion trees for AI-assisted conversations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "PyYAML"]

[project.scripts]
treecer = "treecer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
treecer = ["assets/skills/treecer/SKILL.md", "assets/manual/zh/*.md", "assets/manual/en/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
